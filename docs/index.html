<style>
:root {
  --accent: #e0457b; --accent-ink: #fff;
  --bg: #f6f5f8; --side: #f0eff3; --card: #fff; --stage: #e7e6ea;
  --ink: rgba(0,0,0,.86); --muted: rgba(0,0,0,.52); --line: rgba(0,0,0,.1); --track: rgba(0,0,0,.09);
  --shadow: 0 1px 3px rgba(0,0,0,.14);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1c1c1e; --side: #232325; --card: #2c2c2e; --stage: #19191a;
    --ink: rgba(255,255,255,.88); --muted: rgba(255,255,255,.55); --line: rgba(255,255,255,.12); --track: rgba(255,255,255,.14);
    --shadow: 0 1px 3px rgba(0,0,0,.5); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif; color: var(--ink); background: var(--bg); }
#app { display: flex; height: 100vh; }
aside { width: 330px; flex: none; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line); padding: 18px 20px 24px; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
h3 { font-size: 14px; margin: 0; }
.brand { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
.brand img { width: 44px; height: 44px; }
.brand b { font-size: 18px; display: block; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.caption { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.row .grow { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; box-shadow: var(--shadow); }
button:hover:not(:disabled) { filter: brightness(.97); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
button.wide { width: 100%; padding: 9px 14px; }
button.small { padding: 3px 10px; font-size: 12px; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.seg { display: inline-flex; background: var(--track); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; box-shadow: none; padding: 4px 13px; }
.seg button.sel { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.ctl .head { display: flex; align-items: center; gap: 8px; }
.ctl .head span:first-child { flex: 1; }
.ctl .val { color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.toggle input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--track); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow); transition: left .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { left: 16px; }
#cropBox { text-align: center; }
#cropCanvas { max-width: 100%; border-radius: 6px; touch-action: none; cursor: grab; display: block; margin: 0 auto; }
#cropCanvas.locked { cursor: default; }
.threads { display: flex; flex-direction: column; gap: 2px; }
.thread { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 8px; }
.thread.clickable { cursor: pointer; }
.thread.clickable:hover { background: var(--track); }
.thread.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.sw { width: 24px; height: 24px; border-radius: 5px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 1px solid var(--line); }
.thread .txt { flex: 1; min-width: 0; }
.thread .txt b { display: block; font-size: 13px; }
.thread .txt span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.big .bar { height: 6px; }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#err { color: #d33; font-size: 13px; }
footer { font-size: 12px; color: var(--muted); }
footer a { color: inherit; }
select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
#toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg); }
#toolbar .sep { width: 1px; height: 22px; background: var(--line); }
#toolbar .spacer { flex: 1; }
#toolbar input[type=range] { width: 140px; margin: 0; }
#stage { flex: 1; position: relative; overflow: auto; background: var(--stage); }
#stage.drop { outline: 3px dashed var(--accent); outline-offset: -10px; }
#viewCanvas { display: block; margin: 16px auto; box-shadow: 0 2px 12px rgba(0,0,0,.18); background: #fff; image-rendering: auto; }
#progWrap { position: relative; margin: 16px auto; width: max-content; }
#progWrap canvas { display: block; image-rendering: pixelated; }
#progOver { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }
#empty .ico { font-size: 54px; line-height: 1; }
#busy { position: absolute; top: 16px; right: 16px; background: var(--card); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 14px; font-size: 13px; }
[hidden] { display: none !important; }
dialog { border: 0; border-radius: 14px; padding: 24px 26px; max-width: 520px; color: var(--ink); background: var(--card); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog img { width: 72px; height: 72px; }
dialog p { margin: 8px 0; }
#printRoot { display: none; }
@media (max-width: 820px) {
  #app { flex-direction: column; height: auto; }
  aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  #stage { min-height: 70vh; }
}
@media print {
  @page { size: A4; margin: 0; }

const SYMBOLS = ['●','■','▲','◆','★','✚','✖︎','♥︎','♠︎','♣︎','♦︎','○','□','△','◇','☆','▼','◀︎','▶︎','✿',

// ---- Colour maths (sRGB 0…1, CIE Lab D65)
function srgbToLin(v) { return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function linToSrgb(v) { v = Math.min(1, Math.max(0, v)); return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; }
function rgbToLab(r, g, b) {
  r = srgbToLin(r); g = srgbToLin(g); b = srgbToLin(b);
  const x = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047;
  const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const fx = f(x), fy = f(y), fz = f(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function labToRgb(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const inv = t => { const t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; };
  const x = inv(fx) * 0.95047, y = inv(fy), z = inv(fz) * 1.08883;
  return [linToSrgb(3.2406 * x - 1.5372 * y - 0.4986 * z),
          linToSrgb(-0.9689 * x + 1.8758 * y + 0.0415 * z),
          linToSrgb(0.0557 * x - 0.2040 * y + 1.0570 * z)];
}
function d2(a, b) { const x = a[0] - b[0], y = a[1] - b[1], z = a[2] - b[2]; return x * x + y * y + z * z; }
const luminance = c => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
const hex = c => '#' + c.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
const css = c => `rgb(${c.map(v => Math.round(v * 255)).join(',')})`;
const keyOf = c => (Math.round(c[0] * 255) << 16) | (Math.round(c[1] * 255) << 8) | Math.round(c[2] * 255);

/** CIEDE2000 colour difference – the best approximation of how different two colours look. */
function deltaE2000(c1, c2) {
  const rad = Math.PI / 180, p25 = 6103515625;
  const [L1, a1, b1] = c1, [L2, a2, b2] = c2;
  const cBar = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2, cBar7 = Math.pow(cBar, 7);
  const g = 0.5 * (1 - Math.sqrt(cBar7 / (cBar7 + p25)));
  const a1p = (1 + g) * a1, a2p = (1 + g) * a2;
  const c1p = Math.hypot(a1p, b1), c2p = Math.hypot(a2p, b2);
  const hue = (b, a) => { if (a === 0 && b === 0) return 0; const h = Math.atan2(b, a) / rad; return h < 0 ? h + 360 : h; };
  const h1p = hue(b1, a1p), h2p = hue(b2, a2p);
  const dLp = L2 - L1, dCp = c2p - c1p;
  let dhp = 0;
  if (c1p * c2p !== 0) { dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(c1p * c2p) * Math.sin(dhp * rad / 2);
  const lBarP = (L1 + L2) / 2, cBarP = (c1p + c2p) / 2;
  let hBarP = h1p + h2p;
  if (c1p * c2p !== 0) hBarP = Math.abs(h1p - h2p) > 180 ? (h1p + h2p + (h1p + h2p < 360 ? 360 : -360)) / 2 : (h1p + h2p) / 2;
  const t = 1 - 0.17 * Math.cos((hBarP - 30) * rad) + 0.24 * Math.cos(2 * hBarP * rad)
          + 0.32 * Math.cos((3 * hBarP + 6) * rad) - 0.20 * Math.cos((4 * hBarP - 63) * rad);
  const dTheta = 30 * Math.exp(-Math.pow((hBarP - 275) / 25, 2));
  const cBarP7 = Math.pow(cBarP, 7), rc = 2 * Math.sqrt(cBarP7 / (cBarP7 + p25));
  const l50 = (lBarP - 50) * (lBarP - 50);
  const sl = 1 + 0.015 * l50 / Math.sqrt(20 + l50), sc = 1 + 0.045 * cBarP, sh = 1 + 0.015 * cBarP * t;
  const rt = -Math.sin(2 * dTheta * rad) * rc;
  const x = dLp / sl, y = dCp / sc, z = dHp / sh;
  return Math.sqrt(Math.max(0, x * x + y * y + z * z + rt * y * z));
}

// ---- DMC threads (filled in from DMC_RAW)
let DMC = [];
function initDMC(raw) {
  DMC = raw.map(([code, name, r, g, b]) => { const rgb = [r / 255, g / 255, b / 255]; return { code, name, rgb, lab: rgbToLab(...rgb) }; });
}
function nearestDMC(lab, among) {
  let best = 0, bd = Infinity;
  const list = among || DMC.map((_, i) => i);
  for (const i of list) { const d = deltaE2000(lab, DMC[i].lab); if (d < bd) { bd = d; best = i; } }
  return best;
}

// ---- Deterministic RNG (mulberry32)
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/** The square to crop from the source (top-left origin, pixels). Null for the original shape. */
function cropRect(w, h, shape, cx, cy, zoom) {
  if (shape === 'original') return null;
  const side = Math.min(w, h) / Math.max(1, zoom), half = side / 2;
  const x = Math.min(Math.max(cx * w, half), w - half) - half;
  const y = Math.min(Math.max(cy * h, half), h - half) - half;
  return { x, y, w: side, h: side };
}

/** Downscales to the target stitch count: supersampling + box average. Returns Float32Array rgb (0…1). */
function sampleImage(img, width, forcedH, crop) {
  const sx = crop ? crop.x : 0, sy = crop ? crop.y : 0;
  const sw = crop ? crop.w : img.width, sh = crop ? crop.h : img.height;
  const w = Math.max(1, width);
  const h = forcedH || Math.max(1, Math.round(sh * w / sw));
  const f = Math.max(1, Math.min(6, Math.floor(sw / w)));
  const bw = w * f, bh = h * f;
  const c = document.createElement('canvas'); c.width = bw; c.height = bh;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, bw, bh);   // transparent → white
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, bw, bh);
  const data = ctx.getImageData(0, 0, bw, bh).data;
  const px = new Float32Array(w * h * 3), inv = 1 / (f * f * 255);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let r = 0, g = 0, b = 0;
    for (let dy = 0; dy < f; dy++) { let i = ((y * f + dy) * bw + x * f) * 4; for (let dx = 0; dx < f; dx++, i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; } }
    const o = (y * w + x) * 3; px[o] = r * inv; px[o + 1] = g * inv; px[o + 2] = b * inv;
  }
  return { px, w, h };
}

/** Vibrance (saturation), contrast, highlights and shadows in Lab space; hue is preserved. */
function adjustColors(px, sat, contrast, highlights, shadows) {
  if (Math.abs(sat - 1) < 1e-3 && Math.abs(contrast - 1) < 1e-3 && Math.abs(highlights) < 1e-3 && Math.abs(shadows) < 1e-3) return;
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const cache = new Map();
  for (let i = 0; i < px.length; i += 3) {
    const k = keyOf([px[i], px[i + 1], px[i + 2]]);
    let v = cache.get(k);
    if (!v) {
      let [L, a, b] = rgbToLab(px[i], px[i + 1], px[i + 2]);
      L = 50 + (L - 50) * contrast;
      const t = Math.min(1, Math.max(0, L / 100));
      L += shadows * (1 - ss(0, 0.55, t)) * 30 + highlights * ss(0.45, 1, t) * 30;
      v = labToRgb(Math.min(100, Math.max(0, L)), a * sat, b * sat);
      cache.set(k, v);
    }
    px[i] = v[0]; px[i + 1] = v[1]; px[i + 2] = v[2];
  }
}

/** Colour reduction with weighted k-means in Lab space. Input: array of [r,g,b]. */
function quantize(colors, k) {
  const map = new Map(), uniq = [], weight = [], idx = new Int32Array(colors.length);
  colors.forEach((c, i) => {
    const key = keyOf(c); let j = map.get(key);
    if (j === undefined) { j = uniq.length; map.set(key, j); uniq.push(c); weight.push(1); } else weight[j]++;
    idx[i] = j;
  });
  const lab = uniq.map(c => rgbToLab(...c)), n = lab.length;
  k = Math.max(1, Math.min(k, n));
  const rand = rng(42);
  let first = 0; for (let i = 1; i < n; i++) if (weight[i] > weight[first]) first = i;
  const centers = [lab[first].slice()];
  const dist = lab.map(l => d2(l, lab[first]));
  while (centers.length < k) {
    let total = 0; for (let i = 0; i < n; i++) total += dist[i] * weight[i];
    if (total <= 0) break;
    let r = rand() * total, pick = n - 1;
    for (let i = 0; i < n; i++) { r -= dist[i] * weight[i]; if (r <= 0) { pick = i; break; } }
    centers.push(lab[pick].slice());
    for (let i = 0; i < n; i++) dist[i] = Math.min(dist[i], d2(lab[i], lab[pick]));
  }
  const assign = new Int32Array(n).fill(-1);
  for (let it = 0; it < 25; it++) {
    let changed = false;
    for (let i = 0; i < n; i++) {
      let best = 0, bd = Infinity;
      for (let j = 0; j < centers.length; j++) { const d = d2(lab[i], centers[j]); if (d < bd) { bd = d; best = j; } }
      if (assign[i] !== best) { assign[i] = best; changed = true; }
    }
    if (!changed) break;
    const sums = centers.map(() => [0, 0, 0]), ws = new Float64Array(centers.length);
    for (let i = 0; i < n; i++) { const s = sums[assign[i]], w = weight[i]; s[0] += lab[i][0] * w; s[1] += lab[i][1] * w; s[2] += lab[i][2] * w; ws[assign[i]] += w; }
    centers.forEach((c, j) => { if (ws[j] > 0) { c[0] = sums[j][0] / ws[j]; c[1] = sums[j][1] / ws[j]; c[2] = sums[j][2] / ws[j]; } });
  }
  // For display: the cluster's real average colour in sRGB
  const rs = centers.map(() => [0, 0, 0]), cnt = new Float64Array(centers.length);
  for (let i = 0; i < n; i++) { const s = rs[assign[i]], w = weight[i]; s[0] += uniq[i][0] * w; s[1] += uniq[i][1] * w; s[2] += uniq[i][2] * w; cnt[assign[i]] += w; }
  const remap = new Int32Array(centers.length), palette = [];
  centers.forEach((_, j) => { if (cnt[j] > 0) { remap[j] = palette.length; palette.push(rs[j].map(v => v / cnt[j])); } });
  return { labels: Array.from(idx, j => remap[assign[j]]), palette };
}

/** Merges lone stitches (no same-coloured neighbour) into their surroundings. -1 = empty cell. */
function removeConfetti(labels, w, h, k) {
  const src = labels.slice(), counts = new Int32Array(k);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const me = src[y * w + x]; if (me < 0) continue;
    let same = false; counts.fill(0);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const l = src[ny * w + nx]; if (l < 0) continue;
      if (l === me) same = true; counts[l]++;
    }
    if (!same) { let best = -1, bc = 0; for (let j = 0; j < k; j++) if (counts[j] > bc) { bc = counts[j]; best = j; } if (best >= 0) labels[y * w + x] = best; }
  }
}

/** The whole pipeline. o = {width, colors, cleanup, dmc, shape, crop, vivid, contrast, highlights, shadows} */
function makePattern(img, o) {
  const s = sampleImage(img, o.width, o.shape === 'original' ? 0 : o.width, o.crop);
  adjustColors(s.px, o.vivid, o.contrast, o.highlights, o.shadows);
  const { w, h, px } = s, r = w / 2;
  const included = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (o.shape === 'circle') { const dx = x + 0.5 - r, dy = y + 0.5 - h / 2; if (dx * dx + dy * dy > r * r) continue; }
    included.push(y * w + x);
  }
  const col = i => [px[i * 3], px[i * 3 + 1], px[i * 3 + 2]];
  const q = quantize(included.map(col), o.colors);
  let labels = new Int32Array(w * h).fill(-1);
  included.forEach((i, n) => labels[i] = q.labels[n]);
  let palette = q.palette, threads = null;
  if (o.dmc) {
    const chosen = [];
    for (const c of q.palette) { const d = nearestDMC(rgbToLab(...c)); if (!chosen.includes(d)) chosen.push(d); }
    const cache = new Map();
    for (const i of included) {
      const c = col(i), k = keyOf(c); let v = cache.get(k);
      if (v === undefined) { v = chosen.indexOf(nearestDMC(rgbToLab(...c), chosen)); cache.set(k, v); }
      labels[i] = v;
    }
    palette = chosen.map(d => DMC[d].rgb); threads = chosen.map(d => DMC[d]);
  }
  if (o.cleanup && palette.length > 1) removeConfetti(labels, w, h, palette.length);
  const counts = new Array(palette.length).fill(0);
  for (const l of labels) if (l >= 0) counts[l]++;
  // Sorted by frequency: the most common colour gets the simplest symbol
  const order = palette.map((_, i) => i).filter(i => counts[i] > 0).sort((a, b) => counts[b] - counts[a]);
  const remap = new Int32Array(palette.length); order.forEach((old, nw) => remap[old] = nw);
  labels = labels.map(l => l < 0 ? -1 : remap[l]);
  return { w, h, labels, palette: order.map(i => palette[i]), counts: order.map(i => counts[i]),
           threads: threads && order.map(i => threads[i]), shape: o.shape,
           get stitches() { return this.counts.reduce((a, b) => a + b, 0); } };
}

/** Stable identifier of a pattern (FNV-1a) – saved progress is tied to it. */
function stableKey(p) {
  let h = 0x811c9dc5;
  const mix = v => { h ^= v & 0xffff; h = Math.imul(h, 16777619); h ^= v >>> 16; h = Math.imul(h, 16777619); };
  mix(p.w); mix(p.h); mix(p.shape === 'circle' ? 2 : p.shape === 'square' ? 1 : 0);
  for (const l of p.labels) mix(l + 1);
  for (const c of p.palette) mix(keyOf(c));
  return (h >>> 0).toString(16) + '-' + p.w + 'x' + p.h;
}

// ===================================================================
// CraftDora renderers – chart, stitched preview, progress base, print pages
// ===================================================================
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif';
const MAX_AREA = 16e6;   // keep canvases within the limits of every browser (incl. Safari / iPad)

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

/** One cell: background colour + symbol. */
function cellTile(c, sym, colored, size) {
  const t = mkCanvas(size, size), x = t.getContext('2d');
  x.fillStyle = colored ? css(c) : '#fff'; x.fillRect(0, 0, size, size);
  if (sym) {
    x.fillStyle = colored && luminance(c) < 0.5 ? '#fff' : '#000';
    x.font = `700 ${Math.round(size * 0.64)}px ${FONT}`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(sym, size / 2, size / 2 + size * 0.04);
  }
  return t;
}

function drawGrid(x, ox, oy, w, h, cell, thin = 1, thick = 2) {
  x.save();
  x.strokeStyle = 'rgba(0,0,0,0.38)'; x.lineWidth = thin; x.beginPath();
  for (let i = 0; i <= w; i++) if (i % 10) { const xx = ox + i * cell + 0.5; x.moveTo(xx, oy); x.lineTo(xx, oy + h * cell); }
  for (let j = 0; j <= h; j++) if (j % 10) { const yy = oy + j * cell + 0.5; x.moveTo(ox, yy); x.lineTo(ox + w * cell, yy); }
  x.stroke();
  x.strokeStyle = '#000'; x.lineWidth = thick; x.beginPath();
  for (let i = 0; i <= w; i += 10) { x.moveTo(ox + i * cell, oy); x.lineTo(ox + i * cell, oy + h * cell); }
  for (let j = 0; j <= h; j += 10) { x.moveTo(ox, oy + j * cell); x.lineTo(ox + w * cell, oy + j * cell); }
  x.stroke(); x.strokeRect(ox, oy, w * cell, h * cell);
  x.restore();
}

/** Grid only – for the Progress view and the print overview. */
function renderCells(p, cell, colored, symbols, grid) {
  const c = mkCanvas(p.w * cell, p.h * cell), x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  const tiles = p.palette.map((col, i) => cellTile(col, symbols ? symbol(i) : null, colored, cell));
  for (let y = 0; y < p.h; y++) for (let xx = 0; xx < p.w; xx++) {
    const l = p.labels[y * p.w + xx]; if (l >= 0) x.drawImage(tiles[l], xx * cell, y * cell);
  }
  if (grid) drawGrid(x, 0, 0, p.w, p.h, cell, 1, 2);
  return c;
}

function legendLabel(p, i, maxName = 30) {
  if (p.threads) {
    let n = p.threads[i].name; if (n.length > maxName) n = n.slice(0, maxName - 1) + '…';
    return `DMC ${p.threads[i].code}  ${n}  ·  ${p.counts[i]} ${t('stitches')}`;
  }
  return `${i + 1}.  ${hex(p.palette[i])}  ·  ${p.counts[i]} ${t('stitches')}`;
}
const infoLine = p => `${p.w} × ${p.h} ${t('stitches')}  ·  ${p.palette.length} ${p.threads ? t('dmcColours') : t('colours')}  ·  `
  + aidaText(p);
const num1 = v => { const s = v.toFixed(1); return isHu() ? s.replace('.', ',') : s; };
const aidaText = p => t('aida').replace('{w}', num1(p.w / 14 * 2.54)).replace('{h}', num1(p.h / 14 * 2.54));

/** The chart with header, numbers, centre markers and key (PNG export + Pattern view). */
function renderPattern(p, requestedCell, colored, title) {
  const colW = p.threads ? 440 : 300, rowH = 34, headerH = 76;
  let cell = Math.max(6, Math.min(requestedCell, Math.floor(9000 / Math.max(p.w, p.h))));
  let L;
  for (;;) {
    const margin = Math.max(48, cell * 2), gridW = p.w * cell, gridH = p.h * cell;
    const contentW = Math.max(gridW, colW * 2), cols = Math.max(1, Math.floor(contentW / colW));
    const rows = Math.ceil(p.palette.length / cols), legendTop = headerH + margin + gridH + 44;
    L = { margin, gridW, gridH, cols, rows, legendTop, W: contentW + margin * 2, H: legendTop + 36 + rows * rowH + margin / 2 };
    if (L.W * L.H <= MAX_AREA || cell <= 6) break;
    cell--;
  }
  const c = mkCanvas(L.W, L.H), x = c.getContext('2d');
  const ox = L.margin, oy = headerH + L.margin;
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.textBaseline = 'top';
  x.fillStyle = '#000'; x.font = `700 22px ${FONT}`; x.fillText(`${t('chartTitle')} – ${title}`, L.margin, 18);
  x.fillStyle = '#555'; x.font = `14px ${FONT}`; x.fillText(infoLine(p), L.margin, 50);

  const tiles = p.palette.map((col, i) => cellTile(col, symbol(i), colored, cell));
  for (let y = 0; y < p.h; y++) for (let xx = 0; xx < p.w; xx++) {
    const l = p.labels[y * p.w + xx]; if (l >= 0) x.drawImage(tiles[l], ox + xx * cell, oy + y * cell);
  }
  drawGrid(x, ox, oy, p.w, p.h, cell);
  if (p.shape === 'circle') {
    x.strokeStyle = 'rgba(217,31,89,0.8)'; x.lineWidth = 2; x.beginPath();
    x.ellipse(ox + L.gridW / 2, oy + L.gridH / 2, L.gridW / 2, L.gridH / 2, 0, 0, Math.PI * 2); x.stroke();
  }
  // numbers every ten
  x.fillStyle = '#555'; x.font = `11px ${FONT}`; x.textBaseline = 'alphabetic';
  x.textAlign = 'center'; for (let i = 10; i <= p.w; i += 10) x.fillText(String(i), ox + i * cell, oy - 18);
  x.textAlign = 'right'; for (let j = 10; j <= p.h; j += 10) x.fillText(String(j), ox - 16, oy + j * cell + 4);
  x.textAlign = 'left';
  // red centre markers
  x.fillStyle = '#d91f40'; x.beginPath();
  const cx = ox + L.gridW / 2, cy = oy + L.gridH / 2;
  x.moveTo(cx - 6, oy - 13); x.lineTo(cx + 6, oy - 13); x.lineTo(cx, oy - 3); x.closePath();
  x.moveTo(ox - 13, cy - 6); x.lineTo(ox - 13, cy + 6); x.lineTo(ox - 3, cy); x.closePath(); x.fill();
  // key
  x.textBaseline = 'top'; x.fillStyle = '#000'; x.font = `700 16px ${FONT}`; x.fillText(t('key'), L.margin, L.legendTop);
  const sw = rowH - 8; x.font = `13px ${FONT}`;
  p.palette.forEach((col, i) => {
    const cc = i % L.cols, rr = Math.floor(i / L.cols);
    const lx = L.margin + cc * colW, ly = L.legendTop + 32 + rr * rowH;
    x.drawImage(cellTile(col, symbol(i), true, sw), lx, ly);
    x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 1; x.strokeRect(lx + 0.5, ly + 0.5, sw - 1, sw - 1);
    x.fillStyle = '#000'; x.fillText(legendLabel(p, i), lx + sw + 10, ly + (sw - 15) / 2);
  });
  return c;
}

/** One cross stitch (X) with shaded thread on a transparent background. */
function stitchTile(c, size) {
  const t = mkCanvas(size, size), x = t.getContext('2d');
  const inset = size * 0.1, lw = size * 0.42;
  const dark = c.map(v => v * 0.68), light = c.map(v => v + (1 - v) * 0.4);
  x.lineCap = 'round';
  const thread = (ax, ay, bx, by) => {
    for (const [col, w] of [[dark, lw], [c, lw * 0.7], [light, lw * 0.18]]) {
      x.strokeStyle = css(col); x.lineWidth = w; x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by); x.stroke();
    }
  };
  thread(inset, size - inset, size - inset, inset);   // bottom thread: /
  thread(inset, inset, size - inset, size - inset);   // top thread: \
  return t;
}

/** Roughly how it will look stitched: cross stitches on Aida fabric (in a hoop for circles). */
function renderStitched(p) {
  let cell = Math.max(4, Math.min(16, Math.floor(4000 / Math.max(p.w, p.h))));
  while ((p.w + 6) * (p.h + 6) * cell * cell > MAX_AREA && cell > 4) cell--;
  const pad = cell * 3, gw = p.w * cell, gh = p.h * cell, W = gw + pad * 2, H = gh + pad * 2;
  const cv = mkCanvas(W, H), x = cv.getContext('2d');
  const fabric = [0.965, 0.95, 0.915], circle = p.shape === 'circle';
  const R = gw / 2 + cell * 1.2, cx = W / 2, cy = H / 2;
  x.save();
  if (circle) { x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.clip(); }
  x.fillStyle = css(fabric); x.fillRect(0, 0, W, H);
  x.fillStyle = css(fabric.map(v => v * 0.8));
  const hr = Math.max(0.6, cell * 0.09);
  x.beginPath();
  for (let yy = pad % cell; yy <= H; yy += cell) for (let xx = pad % cell; xx <= W; xx += cell) { x.moveTo(xx + hr, yy); x.arc(xx, yy, hr, 0, Math.PI * 2); }
  x.fill();
  const tiles = p.palette.map(col => stitchTile(col, cell));
  for (let y = 0; y < p.h; y++) for (let xx = 0; xx < p.w; xx++) {
    const l = p.labels[y * p.w + xx]; if (l >= 0) x.drawImage(tiles[l], pad + xx * cell, pad + y * cell);
  }
  x.restore();
  if (circle) {   // embroidery hoop
    const wood = [0.78, 0.6, 0.4], rr = R + cell * 0.6;
    x.lineWidth = cell * 1.6; x.strokeStyle = css(wood.map(v => v * 0.75)); x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI * 2); x.stroke();
    x.lineWidth = cell * 1.1; x.strokeStyle = css(wood); x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI * 2); x.stroke();
  }
  return cv;
}

/** Printable A4 pages (150 dpi): overview + key, then the chart in 40 × 60 pieces. */
function renderPrintPages(p, colored, title) {
  const W = 1240, H = 1754, m = 70, colsPer = 40, rowsPer = 60, cell = 25;
  const pagesX = Math.ceil(p.w / colsPer), pagesY = Math.ceil(p.h / rowsPer), total = 1 + pagesX * pagesY;
  const pages = [];
  const footer = (x, n) => { x.fillStyle = '#888'; x.font = `16px ${FONT}`; x.textAlign = 'right'; x.fillText(`${n} / ${total}  ·  CraftDora`, W - m, H - 40); x.textAlign = 'left'; };

  // ---- page 1: overview + key
  {
    const c = mkCanvas(W, H), x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.textBaseline = 'top';
    x.fillStyle = '#000'; x.font = `700 36px ${FONT}`; x.fillText(`${t('chartTitle')} – ${title}`, m, m);
    x.fillStyle = '#555'; x.font = `20px ${FONT}`; x.fillText(infoLine(p), m, m + 52);
    const lRows = Math.max(1, Math.ceil(p.palette.length / 2)), lRowH = 30, legendH = 50 + lRows * lRowH;
    const ovTop = m + 110, ovMaxW = W - 2 * m, ovMaxH = H - m - legendH - ovTop - 60;
    if (ovMaxH > 120) {
      const ov = renderCells(p, Math.max(1, Math.min(8, Math.floor(2000 / Math.max(p.w, p.h)))), true, false, false);
      const s = Math.min(ovMaxW / ov.width, ovMaxH / ov.height), ow = ov.width * s, oh = ov.height * s, ox = m + (ovMaxW - ow) / 2;
      x.imageSmoothingEnabled = false; x.drawImage(ov, ox, ovTop, ow, oh);
      x.strokeStyle = '#444'; x.lineWidth = 1; x.strokeRect(ox, ovTop, ow, oh);
      if (pagesX * pagesY > 1) {
        const cs = ow / p.w; let n = 2;
        x.strokeStyle = '#d6245e'; x.fillStyle = '#d6245e'; x.lineWidth = 2; x.font = `700 20px ${FONT}`;
        for (let py = 0; py < pagesY; py++) for (let px = 0; px < pagesX; px++) {
          const c0 = px * colsPer, r0 = py * rowsPer;
          const rx = ox + c0 * cs, ry = ovTop + r0 * cs, rw = Math.min(colsPer, p.w - c0) * cs, rh = Math.min(rowsPer, p.h - r0) * cs;
          x.strokeRect(rx, ry, rw, rh); x.fillText(String(n++), rx + 5, ry + 4);
        }
      }
    }
    const lgTop = H - m - legendH, colWidth = (W - 2 * m) / 2;
    x.fillStyle = '#000'; x.font = `700 24px ${FONT}`; x.fillText(t('key'), m, lgTop);
    p.palette.forEach((col, i) => {
      const cc = Math.floor(i / lRows), rr = i % lRows, lx = m + cc * colWidth, ly = lgTop + 44 + rr * lRowH;
      x.drawImage(cellTile(col, symbol(i), true, 24), lx, ly);
      x.strokeStyle = '#555'; x.lineWidth = 1; x.strokeRect(lx + 0.5, ly + 0.5, 23, 23);
      x.fillStyle = '#000'; x.font = `17px ${FONT}`; x.fillText(legendLabel(p, i, 24), lx + 34, ly + 3);
    });
    footer(x, 1); pages.push(c);
  }
  // ---- pattern pages
  const tiles = p.palette.map((col, i) => cellTile(col, symbol(i), colored, cell));
  let n = 2;

function apply(indices, value) {
  const changedIdx = [];
  for (const i of indices) if (pattern.labels[i] >= 0 && done[i] !== value) { done[i] = value; changedIdx.push(i); }
  if (!changedIdx.length) return;
  undo.push({ idx: changedIdx, value }); if (undo.length > 200) undo.shift();
  recount(); persist(); redrawOverlay();
}
function region(start) {
  const target = pattern.labels[start], w = pattern.w, h = pattern.h, seen = new Uint8Array(pattern.labels.length), out = [], st = [start];
  seen[start] = 1;
  while (st.length) {
    const i = st.pop(); out.push(i); const x = i % w, y = (i - x) / w;
    for (const j of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1])
      if (j >= 0 && !seen[j] && pattern.labels[j] === target) { seen[j] = 1; st.push(j); }
  }
  return out;
}
let stroke = null;
function cellAt(e) {
  const r = pOver.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * pattern.w), y = Math.floor((e.clientY - r.top) / r.height * pattern.h);
  return x >= 0 && y >= 0 && x < pattern.w && y < pattern.h ? y * pattern.w + x : -1;
}
pOver.addEventListener('pointerdown', e => {
  const i = cellAt(e); if (i < 0 || pattern.labels[i] < 0) return;
  if (S.markMode === 'region') { apply(region(i), done[i] ? 0 : 1); return; }
  pOver.setPointerCapture(e.pointerId);
  stroke = { value: done[i] ? 0 : 1, idx: [] };
  markCell(i);
});
pOver.addEventListener('pointermove', e => { if (stroke) { const i = cellAt(e); if (i >= 0) markCell(i); } });
['pointerup', 'pointercancel'].forEach(ev => pOver.addEventListener(ev, () => {
  if (stroke && stroke.idx.length) { undo.push({ idx: stroke.idx, value: stroke.value }); persist(); updateSide(); }
  stroke = null;
}));
function markCell(i) {
  const l = pattern.labels[i];
  if (l < 0 || done[i] === stroke.value) return;
  done[i] = stroke.value; doneCounts[l] += stroke.value ? 1 : -1; stroke.idx.push(i);
  drawOverCell(pOver.getContext('2d'), i);
  updateTotals();
}
function doUndo() {
  const e = undo.pop(); if (!e) return;
  for (const i of e.idx) done[i] = e.value ? 0 : 1;
  recount(); persist(); redrawOverlay();
}

// ---------------------------------------------------------------- sidebar
function updateTotals() {
  if (!pattern || !done) return;
  const total = pattern.stitches, d = doneCounts.reduce((a, b) => a + b, 0), pct = Math.round(d / Math.max(1, total) * 100);
  $('#totalBar').style.width = pct + '%';
  $('#totalText').textContent = `${d} / ${total} ${t('stitchesDone')} (${pct}%)`;
  $('#status').textContent = S.view === 'progress' ? `${pct}% ${t('pctDone')}` : '';
  $('#undoBtn').disabled = !undo.length && !stroke;
  document.querySelectorAll('.thread').forEach(row => {
    const i = +row.dataset.i, c = row.querySelector('.cnt'), bar = row.querySelector('.bar i');
    if (S.view === 'progress') { c.textContent = `${doneCounts[i]}/${pattern.counts[i]}`; if (bar) bar.style.width = (doneCounts[i] / pattern.counts[i] * 100) + '%'; }
  });
}
function updateSide() {
  const prog = S.view === 'progress' && !!pattern;
  $('#settings').hidden = prog; $('#progSummary').hidden = !prog;
  $('#threadSec').hidden = !pattern; $('#threadHelp').hidden = !prog;
  $('#cropZoomCtl').hidden = $('#cropHint').hidden = S.shape === 'original' || !img;
  $('#doneBtn').classList.toggle('on', S.showDone);
  $('#hlOff').hidden = S.highlight === null;
  selSeg('#shapeSeg', S.shape); selSeg('#viewSeg', S.view); selSeg('#fitSeg', S.fit ? 'fit' : 'zoom'); selSeg('#markSeg', S.markMode);
  if (!pattern) { $('#stats').textContent = ''; return; }
  const p = pattern;
  $('#stats').innerHTML = `<b>${p.w} × ${p.h} ${t('stitches')}, ${p.palette.length} ${t('colours')}</b><br>` +
    (p.shape === 'circle' ? t('inCircle').replace('{n}', p.stitches) + '<br>' : '') +
    `<span class="muted">${aidaText(p)}</span>`;
  $('#threadTitle').textContent = p.threads ? t('threads') : t('colorsTitle');
  const list = $('#threads'); list.innerHTML = '';
  p.palette.forEach((col, i) => {
    const row = document.createElement('div');
    row.className = 'thread' + (prog ? ' clickable' : '') + (prog && S.highlight === i ? ' sel' : '');
    row.dataset.i = i;
    const fg = luminance(col) < 0.5 ? '#fff' : '#000';
    const name = p.threads ? `<b>DMC ${p.threads[i].code}</b><span>${p.threads[i].name}</span>` : `<b>${hex(col)}</b>`;
    row.innerHTML = `<div class="sw" style="background:${css(col)};color:${fg}">${symbol(i)}</div><div class="txt">${name}${prog ? '<div class="bar"><i></i></div>' : ''}</div><span class="cnt">${p.counts[i]}</span>` +
      (prog ? `<button class="small mark" title="${t('markColour')}">✓</button>` : '');
    if (prog) {
      row.addEventListener('click', e => { if (e.target.closest('.mark')) return; S.highlight = S.highlight === i ? null : i; redrawOverlay(); });
      row.querySelector('.mark').addEventListener('click', () => {
        const idx = []; p.labels.forEach((l, j) => { if (l === i) idx.push(j); });
        apply(idx, doneCounts[i] < p.counts[i] ? 1 : 0);
      });
    }
    list.appendChild(row);
  });
  updateTotals();
}

// ---------------------------------------------------------------- export
function download(canvas, name) {
  canvas.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/png');
}
$('#pngBtn').addEventListener('click', () => {
  if (!pattern) return;
  const prev = S.view === 'preview';
  download(getRender(prev ? 'preview' : 'pattern'), `${imgName}_${t(prev ? 'fileSuffixPreview' : 'fileSuffixPattern')}.png`);
});
$('#pdfBtn').addEventListener('click', () => {
  if (!pattern) return;
  $('#busy').hidden = false;
  setTimeout(() => {
    const root = $('#printRoot'); root.innerHTML = '';
    const pages = renderPrintPages(pattern, S.colored, imgName);
    let loaded = 0;
    pages.forEach(c => { const im = new Image(); im.onload = () => { if (++loaded === pages.length) { $('#busy').hidden = true; window.print(); } }; im.src = c.toDataURL('image/png'); root.appendChild(im); });
  }, 30);
});
window.addEventListener('afterprint', () => { $('#printRoot').innerHTML = ''; });
$('#copyBtn').addEventListener('click', async () => {
  if (!pattern) return;
  const p = pattern;
  const lines = [`${t('chartTitle')} – ${p.w} × ${p.h} ${t('stitches')}, ${p.palette.length} ${t('colours')}`, ''];
  p.palette.forEach((c, i) => lines.push(`${symbol(i)}  ${p.threads ? `DMC ${p.threads[i].code} – ${p.threads[i].name}` : hex(c)}  –  ${p.counts[i]} ${t('stitches')}`));
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const b = $('#copyBtn'); b.textContent = t('copied'); setTimeout(() => b.textContent = t('copy'), 1500);
});

// ---------------------------------------------------------------- wiring
function init() {
  initDMC(DMC_RAW);
  document.querySelectorAll('[data-ctl]').forEach(buildCtl);
  $('#cleanup').checked = S.cleanup; $('#dmc').checked = S.dmc; $('#colored').checked = S.colored;
  ['cleanup', 'dmc', 'colored'].forEach(k => $('#' + k).addEventListener('change', e => { S[k] = e.target.checked; changed(); }));
  $('#resetAll').addEventListener('click', () => { Object.assign(S, { vivid: 1.25, contrast: 1, highlights: 0, shadows: 0 }); document.querySelectorAll('[data-ctl]').forEach(updateCtl); changed(); });
  segment('#shapeSeg', S.shape, v => { S.shape = v; document.querySelectorAll('[data-ctl]').forEach(updateCtl); changed(); updateSide(); });
  segment('#viewSeg', S.view, v => { S.view = v; showView(); });
  segment('#fitSeg', S.fit ? 'fit' : 'zoom', v => { S.fit = v === 'fit'; $('#zoom').hidden = S.fit; layoutView(); });
  segment('#markSeg', S.markMode, v => S.markMode = v);
  $('#zoom').addEventListener('input', e => { S.zoom = +e.target.value; layoutView(); });
  $('#progZoom').addEventListener('input', e => { S.progZoom = +e.target.value; sizeProgress(); });
  $('#undoBtn').addEventListener('click', doUndo);
  $('#doneBtn').addEventListener('click', toggleDone);
  $('#hlOff').addEventListener('click', () => { S.highlight = null; redrawOverlay(); });
  $('#clearAll').addEventListener('click', () => { if (confirm(t('confirmClear'))) apply(Array.from(done.keys()), 0); });
  $('#openBtn').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
  $('#lang').addEventListener('change', e => { langPref = e.target.value; store.set('lang', langPref); applyI18n(); renders = {}; if (pattern) showView(); });
  $('#aboutLink').addEventListener('click', e => { e.preventDefault(); $('#aboutDlg').showModal(); });
  $('#aboutClose').addEventListener('click', () => $('#aboutDlg').close());
  const st = $('#stage');
  window.addEventListener('dragover', e => { e.preventDefault(); st.classList.add('drop'); });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) st.classList.remove('drop'); });
  window.addEventListener('drop', e => { e.preventDefault(); st.classList.remove('drop'); const f = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith('image/')); if (f) loadFile(f); });
  window.addEventListener('keydown', e => {
    if (!(e.metaKey || e.ctrlKey) || S.view !== 'progress' || !pattern) return;
    if (e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); }
    if (e.key.toLowerCase() === 'k') { e.preventDefault(); toggleDone(); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.view === 'progress' && pattern) { stageColour(); redrawOverlay(); } });
  applyI18n(); showView();
}
function toggleDone() { S.showDone = !S.showDone; store.set('showDone', S.showDone); if (pattern) redrawOverlay(); updateSide(); }
init();

</script>
